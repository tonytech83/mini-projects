[project]
name = "net-stats"
version = "0.1.0"
description = "Network starts"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "speedtest-cli",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/net_stats"]

[project.scripts]
net-stats = "net_stats.main:main"
